name: Render Vintage Scrapbook Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Judul video"
        required: true
        default: "RAHASIA DI BALIK BENDA SEHARI-HARI"
      subtitle:
        description: "Subjudul video"
        required: true
        default: "Cerita kecil yang sering luput dari perhatian"
      accent:
        description: "Kalimat inti untuk scene 2"
        required: true
        default: "Setiap hal punya cerita. Kita hanya perlu melihatnya dari sudut yang berbeda."

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Create output folder and props
        run: |
          mkdir -p out
          node -e "const fs=require('fs'); fs.writeFileSync('props.json', JSON.stringify({title: process.env.VIDEO_TITLE, subtitle: process.env.VIDEO_SUBTITLE, accent: process.env.VIDEO_ACCENT}))"
        env:
          VIDEO_TITLE: ${{ github.event.inputs.title }}
          VIDEO_SUBTITLE: ${{ github.event.inputs.subtitle }}
          VIDEO_ACCENT: ${{ github.event.inputs.accent }}
      - name: Render MP4
        run: npx remotion render src/index.ts VintageScrapbook out/vintage-scrapbook.mp4 --codec=h264 --props=props.json
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: vintage-scrapbook-mp4
          path: out/vintage-scrapbook.mp4
          if-no-files-found: error
          retention-days: 14
