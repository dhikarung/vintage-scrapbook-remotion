# Generalized Remotion / papercut render workflow for the GLOBAL video repo.
#
# Repo layout (one repo, one folder per style):
#   styles/
#     vintage-scrapbook/   <- a self-contained Remotion project
#       package.json, src/index.ts, ...
#     diorama-kertas/
#       package.json, src/index.ts, ...
#     kinetic-type/
#     papercut/
#     ...
#
# Place this file at .github/workflows/render-remotion.yml in the repo.
# One workflow renders any style: pick the style folder and the
# composition inside it when you dispatch. To add a style, add a folder
# under styles/ with a working Remotion project — no workflow change needed.
#
# Based on the verified vintage-scrapbook workflow
# (dhikarung/vintage-scrapbook-remotion, "Render Vintage Scrapbook Video",
# workflow id 407618775, tested 2026-11-06), generalized for any style,
# and with a post-render verification step the original lacked: a corrupt
# or black MP4 now FAILS the job instead of passing silently.

name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      style:
        description: "Style folder under styles/ (e.g. vintage-scrapbook, diorama-kertas, papercut)"
        required: true
        default: "vintage-scrapbook"
        type: string
      composition:
        description: "Remotion composition ID to render"
        required: true
        default: "VintageScrapbook"
        type: string
      output:
        description: "Output MP4 filename (created under out/ in the style folder)"
        required: true
        default: "video.mp4"
        type: string
      props:
        description: 'JSON props for the composition, e.g. {"title":"My Title"}'
        required: false
        default: "{}"
        type: string
      min_duration:
        description: "Minimum expected duration in seconds (verification)"
        required: false
        default: "1"
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Check style exists
        run: |
          if [ ! -d "styles/${{ inputs.style }}" ]; then
            echo "::error::Style '${{ inputs.style }}' not found under styles/. Available styles:"
            ls styles/
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: styles/${{ inputs.style }}/package-lock.json

      - name: Install dependencies
        working-directory: styles/${{ inputs.style }}
        run: npm install

      - name: Write props.json
        working-directory: styles/${{ inputs.style }}
        run: |
          cat > props.json <<'PROPS_EOF'
          ${{ inputs.props }}
          PROPS_EOF
          node -e "JSON.parse(require('fs').readFileSync('props.json','utf8')); console.log('props.json is valid JSON')"

      - name: Render video
        working-directory: styles/${{ inputs.style }}
        run: npx remotion render src/index.ts "${{ inputs.composition }}" "out/${{ inputs.output }}" --codec=h264 --props=props.json

      - name: Verify render
        working-directory: styles/${{ inputs.style }}
        run: |
          set -euo pipefail
          FILE="out/${{ inputs.output }}"

          # 1. File exists and is not empty
          test -s "$FILE" || { echo "::error::Output file $FILE is missing or empty"; exit 1; }
          echo "File OK: $(du -h "$FILE" | cut -f1)"

          # 2. ffprobe can read it and duration meets the minimum
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$FILE")
          echo "Duration: ${DURATION}s (minimum: ${{ inputs.min_duration }}s)"
          awk -v d="$DURATION" -v m="${{ inputs.min_duration }}" 'BEGIN { if (d+0 < m+0) { print "::error::Duration " d "s is below the minimum " m "s"; exit 1 } }'

          # 3. Streams present (informational)
          ffprobe -v error -show_entries stream=codec_type,codec_name -of default=noprint_wrappers=1 "$FILE"

          # 4. Not a black/corrupt render: sample frames at 10%, 50%, 90% and
          #    require at least 2 of 3 to have mean luma above the threshold.
          #    Measured on real files: a black render reads 0, a normal frame
          #    reads ~140, so the threshold of 10 has a wide margin.
          #    A fully black or corrupt render fails the job here.
          BRIGHT=0
          for PCT in 10 50 90; do
            T=$(awk -v d="$DURATION" -v p="$PCT" 'BEGIN { printf "%.2f", d*p/100 }')
            LUMA=$(ffmpeg -v error -ss "$T" -i "$FILE" -frames:v 1 -vf "scale=1:1" -f rawvideo -pix_fmt gray - | od -An -tu1 | tr -d ' ')
            echo "Frame at ${PCT}% (t=${T}s): mean luma ${LUMA:-?}"
            awk -v y="${LUMA:-0}" 'BEGIN { exit (y+0 > 10) ? 0 : 1 }' && BRIGHT=$((BRIGHT+1))
          done
          echo "Bright frames: ${BRIGHT}/3"
          if [ "$BRIGHT" -lt 2 ]; then
            echo "::error::Render looks black or corrupt (fewer than 2 of 3 sampled frames have any brightness)"
            exit 1
          fi
          echo "Verification passed."

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.style }}-${{ inputs.output }}
          path: styles/${{ inputs.style }}/out/${{ inputs.output }}
          retention-days: 14
          if-no-files-found: error
